# Default values for trivy-operator-collector.
# This is a YAML-formatted file.

image:
  repository: ghcr.io/starttoaster/trivy-operator-explorer-collector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # Set to 'debug' for more logs
  log_level: 'info'

  # Required: the name used as the S3 key namespace for this cluster's reports.
  clusterName: ''

  # How often to read the cluster's reports and write them to S3.
  syncInterval: '5m'

# S3 configuration. The collector writes this cluster's report bundle here.
s3:
  # Required: the bucket to write to.
  bucket: ''
  # Optional key prefix within the bucket.
  prefix: ''
  # Region.
  #   - AWS S3: set to the bucket's region (or leave empty to use the SDK's
  #     default resolution from the environment/instance metadata).
  #   - Non-AWS (SeaweedFS/MinIO): any value is usually accepted; 'us-east-1'
  #     is a safe placeholder.
  region: ''
  # Custom S3 endpoint URL.
  #   - AWS S3: leave empty to use the standard regional endpoints.
  #   - Non-AWS (SeaweedFS/MinIO): set the S3 API endpoint, e.g.
  #     'http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333'. When set, the
  #     app automatically uses path-style addressing.
  endpoint: ''
  # Credentials. By default they are resolved via the standard AWS credential
  # chain (IRSA/web-identity via serviceAccount.annotations, instance profile,
  # or environment). For non-AWS backends or static keys, reference a secret.
  credentials:
    # Name of an existing secret holding the access key id and secret access
    # key. Leave empty to rely on the default credential chain (e.g. IRSA).
    existingSecret: ''
    # Keys within existingSecret that hold the credentials.
    existingSecretKeys:
      accessKeyId: 'AWS_ACCESS_KEY_ID'
      secretAccessKey: 'AWS_SECRET_ACCESS_KEY'

# Extra environment variables to add to the collector container.
extraEnv: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account (e.g. IRSA role ARN)
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 30000
  fsGroup: 2000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
      - ALL
  runAsUser: 10001
  runAsGroup: 30000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
